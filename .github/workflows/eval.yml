name: FlowERP Eval Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/l08-ci-remote-ready-*"
      - "codex/l08-missing-report-remote-ready-*"

permissions:
  contents: read

jobs:
  blocking-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_DIR: _ci_reports/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        continue-on-error: true # L08 A: deliberately demonstrate a false-green adapter.
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Unified blocking gate
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$REPORT_DIR"
          python -X utf8 -m eval.harness --suite blocking --report-path "$REPORT_DIR/harness-blocking.json" || true
      - name: Bind Evidence Envelope to this run
        if: always()
        run: python -X utf8 -m workbench.ci_evidence --report "$REPORT_DIR/harness-blocking.json" --output "$REPORT_DIR/ci-evidence.json"
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowerp-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REPORT_DIR }}/harness-blocking.json
            ${{ env.REPORT_DIR }}/ci-evidence.json
          if-no-files-found: error
